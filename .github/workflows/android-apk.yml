name: Build Personal Finance Manager APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36 for Capacitor 8)
        uses: android-actions/setup-android@v3

      - name: Install Android 36 Platform & Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies, test & build web app
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Scaffold & sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply hardened offline AndroidManifest & backup rules
        run: |
          mkdir -p android/app/src/main/res/xml

          cat << 'EOF' > android/app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="database" path="." />
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="file" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="database" path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" tools:node="remove" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="false"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode|navigation"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
